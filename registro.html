<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro de Usuario | Sedachimbote</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(145deg, #f0f9ff 0%, #e0f0fa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .register-container { max-width: 520px; width: 100%; margin: 2rem auto; }
    .register-card {
      background: rgba(255,255,255,0.97);
      backdrop-filter: blur(2px);
      border-radius: 2rem;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
      overflow: hidden;
      border: 1px solid rgba(72,187,255,0.3);
    }
    .register-header {
      background: linear-gradient(135deg, #0077b6, #023e8a);
      padding: 2rem 1.5rem;
      text-align: center;
      color: white;
    }
    .register-header h1 { font-family: 'Syne', sans-serif; font-size: 1.9rem; font-weight: 700; margin-bottom: 0.5rem; }
    .register-header p { font-size: 0.9rem; opacity: 0.9; }
    .register-body { padding: 2rem 1.8rem; }
    .form-group { margin-bottom: 1.3rem; }
    .form-group label { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #1e2a3e; margin-bottom: 8px; font-size: 0.9rem; }
    .form-group label i { color: #0077b6; width: 20px; }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      transition: all 0.2s;
      background: #fff;
    }
    .form-group input:focus { outline: none; border-color: #0077b6; box-shadow: 0 0 0 3px rgba(0,119,182,0.2); }
    .checkbox-group { display: flex; align-items: center; gap: 10px; margin: 1.2rem 0; }
    .checkbox-group input { width: 18px; height: 18px; cursor: pointer; }
    .checkbox-group label { font-size: 0.85rem; color: #334155; cursor: pointer; }
    .btn-register {
      width: 100%;
      background: linear-gradient(95deg, #0077b6, #0096c7);
      border: none;
      padding: 14px;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 18px rgba(0,119,182,0.3);
    }
    .btn-register:hover { background: linear-gradient(95deg, #023e8a, #0077b6); transform: translateY(-2px); }
    .login-link { text-align: center; margin-top: 1.8rem; font-size: 0.9rem; color: #1e2a3e; }
    .login-link a { color: #0077b6; font-weight: 600; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }
    .back-home { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 1rem; color: #023e8a; text-decoration: none; font-weight: 500; transition: 0.2s; }
    .back-home:hover { gap: 12px; color: #0077b6; }
    .error-msg { color: #dc2626; font-size: 0.75rem; margin-top: 5px; display: none; }
    .success-message {
      background: #059669;
      color: white;
      padding: 1rem;
      border-radius: 1rem;
      text-align: center;
      margin-top: 1rem;
      display: none;
    }
    .btn-success {
      display: inline-block;
      background: white;
      color: #059669;
      padding: 8px 20px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: bold;
      margin-top: 10px;
      transition: 0.2s;
    }
    .btn-success:hover { background: #f0fdf4; transform: scale(1.02); }
  </style>
</head>
<body>
<div class="register-container">
  <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
  <div class="register-card">
    <div class="register-header">
      <h1><i class="fas fa-user-plus"></i> Crear cuenta</h1>
      <p>Regístrate para acceder a todos nuestros servicios</p>
    </div>
    <div class="register-body">
      <form id="registerForm">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Nombre completo</label>
          <input type="text" id="fullname" placeholder="Ej: Ana María Pérez" required>
          <div class="error-msg" id="error-name"></div>
        </div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Correo electrónico</label>
          <input type="email" id="email" placeholder="tu@email.com" required>
          <div class="error-msg" id="error-email"></div>
        </div>
        <div class="form-group">
          <label><i class="fas fa-phone"></i> Teléfono (opcional)</label>
          <input type="tel" id="phone" placeholder="+51 999 888 777">
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Contraseña</label>
          <input type="password" id="password" placeholder="Mínimo 6 caracteres" required>
          <div class="error-msg" id="error-password"></div>
        </div>
        <div class="form-group">
          <label><i class="fas fa-check-circle"></i> Confirmar contraseña</label>
          <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
          <div class="error-msg" id="error-confirm"></div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="terms" required>
          <label for="terms">Acepto los <a href="#" style="color:#0077b6;">Términos y Condiciones</a></label>
        </div>
        <button type="submit" class="btn-register"><i class="fas fa-user-check"></i> Registrarme</button>
      </form>
      
      <!-- Mensaje de éxito con botón manual -->
      <div id="successMessage" class="success-message">
        <i class="fas fa-check-circle"></i> ¡Registro exitoso!<br>
        <a href="login.html" class="btn-success">Ir a Iniciar Sesión</a>
      </div>
      
      <div class="login-link">
        ¿Ya tienes cuenta? <a href="login.html" id="loginLink">Inicia sesión aquí</a>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const fullname = document.getElementById('fullname');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const confirmPassword = document.getElementById('confirmPassword');
    const terms = document.getElementById('terms');
    const nameError = document.getElementById('error-name');
    const emailError = document.getElementById('error-email');
    const passError = document.getElementById('error-password');
    const confirmError = document.getElementById('error-confirm');
    const successDiv = document.getElementById('successMessage');
    
    function clearErrors() {
      [nameError, emailError, passError, confirmError].forEach(err => {
        err.style.display = 'none';
        err.textContent = '';
      });
    }
    function showError(el, msg) { el.textContent = msg; el.style.display = 'block'; }
    function isValidEmail(str) { return /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(str); }
    
    clearErrors();
    successDiv.style.display = 'none';
    let valid = true;
    
    if (!fullname.value.trim()) { showError(nameError, 'Nombre completo obligatorio'); valid = false; }
    else if (fullname.value.trim().length < 3) { showError(nameError, 'Mínimo 3 caracteres'); valid = false; }
    
    const emailVal = email.value.trim();
    if (!emailVal) { showError(emailError, 'Correo requerido'); valid = false; }
    else if (!isValidEmail(emailVal)) { showError(emailError, 'Correo inválido'); valid = false; }
    
    const pwd = password.value;
    if (!pwd) { showError(passError, 'Contraseña obligatoria'); valid = false; }
    else if (pwd.length < 6) { showError(passError, 'Mínimo 6 caracteres'); valid = false; }
    
    if (confirmPassword.value !== pwd) { showError(confirmError, 'Las contraseñas no coinciden'); valid = false; }
    if (!terms.checked) { showError(confirmError, 'Acepta los términos'); valid = false; }
    if (!valid) return;
    
    // Guardar usuario
    let usuarios = JSON.parse(localStorage.getItem('usuarios_sedachimbote')) || [];
    if (usuarios.some(u => u.email === emailVal)) {
      showError(emailError, 'Este correo ya está registrado. Inicia sesión.');
      return;
    }
    const nuevoUsuario = { id: Date.now(), nombre: fullname.value.trim(), email: emailVal, password: pwd };
    usuarios.push(nuevoUsuario);
    localStorage.setItem('usuarios_sedachimbote', JSON.stringify(usuarios));
    
    // Mostrar mensaje de éxito con botón manual
    successDiv.style.display = 'block';
    // Opcional: limpiar formulario
    document.getElementById('registerForm').reset();
  });
</script>
</body>
</html>
