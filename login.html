<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Sedachimbote</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: linear-gradient(145deg, #f0f9ff 0%, #e0f0fa 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .login-container { max-width: 460px; width: 100%; margin: 2rem auto; }
    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: 2rem;
      overflow: hidden;
      box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
    }
    .login-header {
      background: linear-gradient(135deg, #0077b6, #023e8a);
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .login-header h1 { font-family: 'Syne', sans-serif; font-size: 2rem; margin-bottom: 0.5rem; }
    .login-body { padding: 2rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { font-weight: 600; display: block; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
    }
    .form-group input:focus { outline: none; border-color: #0077b6; box-shadow: 0 0 0 3px rgba(0,119,182,0.2); }
    .btn-login {
      width: 100%;
      background: linear-gradient(95deg, #0077b6, #0096c7);
      border: none;
      padding: 14px;
      border-radius: 40px;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-login:hover { background: linear-gradient(95deg, #023e8a, #0077b6); transform: translateY(-2px); }
    .register-link { text-align: center; margin-top: 1.5rem; }
    .register-link a { color: #0077b6; text-decoration: none; font-weight: 600; }
    .error-msg { color: #dc2626; font-size: 0.8rem; margin-top: 6px; display: none; }
    .back-home {
      display: inline-block;
      margin-bottom: 1rem;
      color: #023e8a;
      text-decoration: none;
      font-weight: 500;
    }
    .back-home:hover { color: #0077b6; }
  </style>
</head>
<body>
<div class="login-container">
  <a href="index.html" class="back-home"><i class="fas fa-arrow-left"></i> Volver al inicio</a>
  <div class="login-card">
    <div class="login-header">
      <h1><i class="fas fa-sign-in-alt"></i> Iniciar sesión</h1>
      <p>Accede con tu correo y contraseña</p>
    </div>
    <div class="login-body">
      <form id="loginForm">
        <div class="form-group">
          <label>Correo electrónico</label>
          <input type="email" id="loginEmail" placeholder="tu@email.com" required>
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="loginPassword" placeholder="Contraseña" required>
        </div>
        <div id="loginError" class="error-msg"></div>
        <button type="submit" class="btn-login"><i class="fas fa-key"></i> Ingresar</button>
      </form>
      <div class="register-link">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
      </div>
    </div>
  </div>
</div>
<script>
  // =======================================================
  // CAMBIA ESTA VARIABLE POR LA PÁGINA A LA QUE QUIERAS REDIRIGIR
  const redirectUrl = 'dashboard.html';   // <--- REEMPLAZA 'dashboard.html' por tu archivo (ej: 'inicio.html', 'perfil.html', etc.)
  // =======================================================

  document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errorDiv = document.getElementById('loginError');
    const usuarios = JSON.parse(localStorage.getItem('usuarios_sedachimbote')) || [];
    const usuario = usuarios.find(u => u.email === email && u.password === password);
    if (usuario) {
      const sessionData = { id: usuario.id, nombre: usuario.nombre, email: usuario.email };
      localStorage.setItem('usuario_activo', JSON.stringify(sessionData));
      // Redirige a la URL que definiste arriba
      window.location.href = redirectUrl;
    } else {
      errorDiv.style.display = 'block';
      errorDiv.textContent = 'Correo o contraseña incorrectos.';
    }
  });
</script>
</body>
</html>
